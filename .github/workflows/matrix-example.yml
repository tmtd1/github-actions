name: Matrix Example

on:
    push:
    workflow_dispatch:

jobs:
    Deploy_job:
        strategy:
          fail-fast: false
          max-parallel: 2
          matrix:
            os: [ubuntu-latest, ubuntu-22.04, windows-latest]
            images: [hello-world, alpine]
            # exclude:
            #   - os: windows-latest
            #     images: alpine
            include:
              - images: amd64/alpine
                os: ubuntu-latest
        runs-on: ${{matrix.os}}
        steps:
            - name: echo docker details
              run: docker info

            - name: run image on ${{matrix.images}}
              run: docker run ${{matrix.images}}

